schema_version: 1

context:
  name: tldextract
  version: "5.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/tldextract-${{ version }}.tar.gz
  sha256: 6c9223212c15c25c0da2bf7313893c14f175cb36b64a0c42da67a468e0c61ee3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tldextract = tldextract.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.2
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - idna
    - requests >=2.1.0
    - requests-file >=1.4
    - filelock >=3.0.8

tests:
  - python:
      imports:
        - tldextract
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - tldextract --help

about:
  summary: Accurately separates a URL's subdomain, domain, and public suffix, using the Public Suffix List (PSL). By default, this includes the public ICANN TLDs and their exceptions. You can optionally support the Public Suffix List's private domains as well.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/john-kurkowski/tldextract

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
